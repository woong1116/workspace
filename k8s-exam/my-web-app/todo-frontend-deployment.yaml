apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      containers:
        - name: frontend
          image: my-todo-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80

          env:
            # ConfigMap
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: APP_NAME

            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: APP_VERSION

            - name: MAX_ITEMS
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MAX_ITEMS

            # Secret
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend-service
spec:
  type: NodePort
  selector:
    app: todo-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080