<!DOCTYPE html>
<html>

<head>
    <title>CSS3 Style Property Basic</title>
    <style>
        p:nth-child(1) {
            color: rgb(208, 18, 18);
        }
        p:nth-child(2) {
            color: rgb(169, 158, 36);
        }
        p:nth-child(3) {
            color: rgb(44, 110, 197);
        }
        p:nth-child(4) {
            color: rgb(92, 34, 178);
        }
    </style>
</head>

<body>
    <div>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    </div>
</body>

</html>
